# Minute by Minute: a nightly copy of the database (free Supabase has no backups).
#
# Each night it copies the database (public: everything recorded; auth: the accounts), locks the
# copy with a passphrase (this repo is public, so nobody else can read it), and keeps it here for
# 90 days: Actions → "Minute by Minute backup" → a run → Artifacts.
# (It also counts as activity, so the free Supabase project never pauses.)
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   MBM_DB_URL             Supabase → Connect → Session pooler connection string, with the password
#   MBM_BACKUP_PASSPHRASE  a long passphrase; keep it somewhere safe, without it the copies can't be opened
#
# Opening a copy:
#   gpg --decrypt mbm-YYYY-MM-DD.dump.gpg > mbm.dump
#   pg_restore --list mbm.dump                       (what's in it)
#   pg_restore --data-only --table=<name> -d <url> mbm.dump   (put one table's rows back)

name: Minute by Minute backup

on:
  schedule:
    - cron: "17 9 * * *" # 3:17 AM Chicago (4:17 in summer)
  workflow_dispatch: # run it now: Actions → this workflow → Run workflow

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Copy and lock
        env:
          DB_URL: ${{ secrets.MBM_DB_URL }}
          PASSPHRASE: ${{ secrets.MBM_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then echo "Add the MBM_DB_URL and MBM_BACKUP_PASSPHRASE secrets first."; exit 1; fi
          day=$(date -u +%F)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --schema=public --schema=auth --file=mbm.dump
          ls -lh mbm.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 --output "mbm-$day.dump.gpg" mbm.dump
          rm mbm.dump
          echo "DAY=$day" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: mbm-${{ env.DAY }}
          path: mbm-${{ env.DAY }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
